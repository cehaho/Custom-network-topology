[package]
name = "app"
version = "1.0.0"
description = "Interactive network topology viewer"
authors = []
license = "MIT"
repository = ""
edition = "2024"
rust-version = "1.90"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[features]
default = ["os-keyring"]
os-keyring = []

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7.4" }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2.12.5" }
tauri-plugin-log = "2"
russh = "0.65.1"
tokio = { version = "1.54.1", features = ["macros", "rt-multi-thread", "time", "process", "sync", "io-util", "net"] }
aes-gcm = "0.11.1"
rand = "0.10.3"
base64 = "0.23.1"
keyring = "4.2.0"
if-addrs = "0.15.0"
tauri-plugin-dialog = "2.8.4"
chrono = "0.4.45"
tauri-plugin-notification = "2"
dns-lookup = "4.0.2"
